name: dco

# Every commit of a pull request must carry a Signed-off-by trailer that
# matches its author (Developer Certificate of Origin, see CONTRIBUTING.md).
# Runs on pull_request (never pull_request_target): no secrets, a read-only
# token, and the PR's code is only read by git, never executed.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
