<div class="hm-field"><label class="hm-field__label" for="sf-content-headline">Headline</label>
<input class="hm-field__control" type="text" id="sf-content-headline" name="content.headline" value="" placeholder="Enter Headline">
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-subheadline">Subheadline</label>
<textarea class="hm-field__control" id="sf-content-subheadline" name="content.subheadline" rows="10" data-hm-editor="tiptap">
</textarea>
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-buttonText">Button text</label>
<input class="hm-field__control" type="text" id="sf-content-buttonText" name="content.buttonText" value="" placeholder="Enter Button text">
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-buttonUrl">Button URL</label>
<input class="hm-field__control" type="url" id="sf-content-buttonUrl" name="content.buttonUrl" value="" placeholder="Enter Button URL">
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-backgroundStyle">Background</label>
<div class="hm-select" data-hm-select><select class="hm-field__control" id="sf-content-backgroundStyle" name="content.backgroundStyle"><option value="">Select Background</option><option value="plain">Plain</option><option value="tinted">Tinted</option><option value="dark">Dark</option></select></div>
</div>
