<div class="hm-field"><label class="hm-field__label" for="sf-content-headline">Headline</label>
<input class="hm-field__control" type="text" id="sf-content-headline" name="content.headline" value="Sample headline" placeholder="Enter Headline">
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-subheadline">Subheadline</label>
<textarea class="hm-field__control" id="sf-content-subheadline" name="content.subheadline" rows="10" data-hm-editor="tiptap">
&lt;p&gt;Hello &lt;strong&gt;subheadline&lt;/strong&gt; &amp;amp; &#34;friends&#34;&lt;/p&gt;
&lt;p&gt;Second&lt;/p&gt;</textarea>
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-buttonText">Button text</label>
<input class="hm-field__control" type="text" id="sf-content-buttonText" name="content.buttonText" value="Sample buttonText" placeholder="Enter Button text">
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-buttonUrl">Button URL</label>
<input class="hm-field__control" type="url" id="sf-content-buttonUrl" name="content.buttonUrl" value="https://example.com/buttonUrl" placeholder="Enter Button URL">
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-backgroundStyle">Background</label>
<div class="hm-select" data-hm-select><select class="hm-field__control" id="sf-content-backgroundStyle" name="content.backgroundStyle"><option value="">Select Background</option><option value="plain">Plain</option><option value="tinted">Tinted</option><option value="dark" selected>Dark</option></select></div>
</div>
