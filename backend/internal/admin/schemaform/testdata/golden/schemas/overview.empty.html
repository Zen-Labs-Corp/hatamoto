<div class="hm-field"><label class="hm-field__label" for="sf-content-eyebrow">Eyebrow</label>
<input class="hm-field__control" type="text" id="sf-content-eyebrow" name="content.eyebrow" value="" placeholder="Enter Eyebrow">
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-headline">Heading</label>
<input class="hm-field__control" type="text" id="sf-content-headline" name="content.headline" value="" placeholder="Enter Heading">
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-subheading">Subheading</label>
<input class="hm-field__control" type="text" id="sf-content-subheading" name="content.subheading" value="" placeholder="Enter Subheading">
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-body">Body</label>
<textarea class="hm-field__control" id="sf-content-body" name="content.body" rows="10" data-hm-editor="tiptap">
</textarea>
</div>
<fieldset class="hm-repeater" id="sf-content-items" data-hm-repeater data-path="content.items"><legend class="hm-field__label">Highlights <span class="hm-muted">(0 items)</span></legend>
<input type="hidden" name="_present.content.items" value="1">
<ol class="hm-repeater__list" role="list" data-hm-sortable>
</ol>
<button type="submit" class="hm-btn hm-btn--sm" name="_add.content.items" value="1" formnovalidate>Add Highlights item</button>
</fieldset>

<div class="hm-field"><label class="hm-field__label" for="sf-content-image">Image</label>
<div class="hm-row"><input class="hm-field__control" type="url" id="sf-content-image" name="content.image" value="" placeholder="https://" data-hm-image><button type="button" class="hm-btn hm-btn--sm" data-hm-media-picker="sf-content-image" hidden>Choose from library</button></div>
</div>
