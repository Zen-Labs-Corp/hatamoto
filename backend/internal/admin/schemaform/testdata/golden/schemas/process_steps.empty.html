<div class="hm-field"><label class="hm-field__label" for="sf-content-eyebrow">Eyebrow</label>
<input class="hm-field__control" type="text" id="sf-content-eyebrow" name="content.eyebrow" value="" placeholder="Enter Eyebrow">
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-heading">Heading</label>
<input class="hm-field__control" type="text" id="sf-content-heading" name="content.heading" value="" placeholder="Enter Heading">
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-subheading">Subheading</label>
<input class="hm-field__control" type="text" id="sf-content-subheading" name="content.subheading" value="" placeholder="Enter Subheading">
</div>

<div class="hm-select" data-hm-select><select class="hm-field__control" id="sf-content-layout" name="content.layout"><option value="">Select Layout</option><option value="list">List</option><option value="cards">Cards</option></select></div>

</ol>
<button type="submit" class="hm-btn hm-btn--sm" name="_add.content.steps" value="1" formnovalidate>Add Steps item</button>
</fieldset>
