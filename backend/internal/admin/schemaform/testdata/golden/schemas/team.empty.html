<div class="hm-field"><label class="hm-field__label" for="sf-content-heading">Heading</label>
<input class="hm-field__control" type="text" id="sf-content-heading" name="content.heading" value="" placeholder="Enter Heading">
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-subheading">Subheading</label>
<input class="hm-field__control" type="text" id="sf-content-subheading" name="content.subheading" value="" placeholder="Enter Subheading">
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-variant">Variant</label>
<div class="hm-select" data-hm-select><select class="hm-field__control" id="sf-content-variant" name="content.variant"><option value="">Select Variant</option><option value="cards">Cards</option><option value="simple">Simple</option><option value="centered">Centered</option></select></div>
</div>
<div class="hm-field"><label class="hm-field__label" for="sf-content-columns">Columns</label>
<input class="hm-field__control" type="number" id="sf-content-columns" name="content.columns" value="" step="1">
</div>
<div class="hm-field"><input type="hidden" name="_present.content.showBios" value="default"><label class="hm-field__check hm-switch" for="sf-content-showBios"><input class="hm-field__box" type="checkbox" role="switch" id="sf-content-showBios" name="content.showBios" value="true" checked><span>Show bios</span></label></div>

<div class="hm-field"><input type="hidden" name="_present.content.showSocialLinks" value="default"><label class="hm-field__check hm-switch" for="sf-content-showSocialLinks"><input class="hm-field__box" type="checkbox" role="switch" id="sf-content-showSocialLinks" name="content.showSocialLinks" value="true" checked><span>Show social links</span></label></div>

<fieldset class="hm-repeater" id="sf-content-members" data-hm-repeater data-path="content.members"><legend class="hm-field__label">Members <span class="hm-muted">(0 items)</span></legend>
<input type="hidden" name="_present.content.members" value="1">
<ol class="hm-repeater__list" role="list" data-hm-sortable>
</ol>
<button type="submit" class="hm-btn hm-btn--sm" name="_add.content.members" value="1" formnovalidate>Add Members item</button>
</fieldset>
