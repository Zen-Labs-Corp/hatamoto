{{define "form_confirmation.html"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We received your submission: {{.FormName}}</title>
</head>
<body style="margin:0;padding:0;width:100%;background-color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;color:#0a0a0a;">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color:#fafafa;padding:40px 16px;">
<tr><td align="center">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:540px;background-color:#ffffff;border:1px solid #e5e5e5;border-radius:12px;">
<tr><td style="padding:40px;">

<h1 style="margin:0 0 16px 0;font-size:24px;line-height:1.3;color:#0a0a0a;font-weight:600;">{{if .Name}}Thank you, {{.Name}}.{{else}}Thank you.{{end}}</h1>

<p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#404040;">{{nl2br .Message}}</p>

<hr style="border:none;border-top:1px solid #e5e5e5;margin:32px 0;">

<p style="margin:0;font-size:12px;color:#737373;line-height:1.6;">This is an automatic confirmation that your “{{.FormName}}” submission was received by {{.SiteName}}.</p>

</td></tr></table>
</td></tr>
</table>
</body>
</html>{{end}}
