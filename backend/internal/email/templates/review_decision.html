{{define "review_decision.html"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Heading}}</title>
</head>
<body style="margin:0;padding:0;width:100%;background-color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;color:#0a0a0a;">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color:#fafafa;padding:40px 16px;">
<tr><td align="center">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:540px;background-color:#ffffff;border:1px solid #e5e5e5;border-radius:12px;">
<tr><td style="padding:40px;">

<h1 style="margin:0 0 16px 0;font-size:24px;line-height:1.3;color:#0a0a0a;font-weight:600;">{{.Heading}}</h1>

<p style="margin:0 0 16px 0;font-size:14px;line-height:1.6;color:#404040;">{{.Lead}}</p>
{{if .Comment}}
<p style="margin:0 0 4px 0;font-size:12px;line-height:1.6;color:#737373;">{{if .Reviewer}}{{.Reviewer}} wrote:{{else}}Comment:{{end}}</p>
<p style="margin:0 0 24px 0;padding:12px 16px;font-size:14px;line-height:1.6;color:#404040;background-color:#fafafa;border-left:3px solid #e5e5e5;white-space:pre-wrap;">{{.Comment}}</p>
{{end}}
<p style="margin:0;"><a href="{{.URL}}" style="display:inline-block;background-color:#171717;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 20px;border-radius:10px;">{{.Button}}</a></p>

</td></tr></table>
</td></tr>
</table>
</body>
</html>{{end}}
