<section id="sec-contact-info" data-hm-section="sec-contact-info" data-hm-type="contact_info" class="hm-section hm-section--contact_info"><div class="hm-container hm-contact-info hm-contact-info--card">
  <h2 class="hm-contact-info__heading" data-hm-field="heading">Visit or call us</h2>
  <div class="hm-contact-info__body">
    <address class="hm-contact-info__address">
      <span class="hm-contact-info__line" data-hm-field="address.street">1 Example Street</span>
      <span class="hm-contact-info__line"><span data-hm-field="address.city">Springfield</span>, <span data-hm-field="address.state">IL</span> <span data-hm-field="address.postal_code">62701</span></span>
      <span class="hm-contact-info__line" data-hm-field="address.country">USA</span>
    </address>
    <ul class="hm-contact-info__channels">
      <li><a class="hm-contact-info__phone" href="tel:&#43;15550100" data-hm-field="phone">&#43;1 555 0100</a></li>
      <li><a class="hm-contact-info__email" href="mailto:hello@example.test" data-hm-field="email">hello@example.test</a></li>
    </ul>
    <dl class="hm-contact-info__hours">
      <div class="hm-contact-info__hours-row"><dt data-hm-field="hours.0.day">Mon–Fri</dt><dd><span data-hm-field="hours.0.open">09:00</span> – <span data-hm-field="hours.0.close">17:00</span></dd></div><div class="hm-contact-info__hours-row"><dt data-hm-field="hours.1.day">Sat</dt><dd><span data-hm-field="hours.1.open">10:00</span> – <span data-hm-field="hours.1.close">14:00</span></dd></div>
    </dl>
  </div>
  
  <div class="hm-contact-info__map"><iframe src="https://www.google.com/maps/embed?pb=abc" title="Map" loading="lazy" referrerpolicy="no-referrer"></iframe></div>
</div></section>
