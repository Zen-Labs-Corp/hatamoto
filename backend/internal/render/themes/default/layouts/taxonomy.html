{{define "content"}}<div class="hm-container hm-listing">
<header class="hm-listing__header">
<p class="hm-listing__eyebrow">{{if eq .Term.Kind "tag"}}{{t . "tag"}}{{else}}{{t . "category"}}{{end}}</p>
<h1 class="hm-listing__title">{{.Term.Name}}</h1>
{{with .Pagination}}<p class="hm-listing__lede">{{if eq .Total 1}}{{t $ "post_count_one" .Total}}{{else}}{{t $ "post_count_other" .Total}}{{end}}</p>
{{end}}</header>
{{template "post-list" .}}
</div>{{end}}
