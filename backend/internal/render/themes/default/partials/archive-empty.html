{{define "archive-empty"}}<div class="hm-empty-state">
<span class="hm-empty-state__icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
<h2 class="hm-empty-state__title">{{t . "no_posts_yet"}}</h2>
<p class="hm-empty-state__text">{{t . "no_posts_hint"}}{{if .Site.Feeds}} {{t . "no_posts_feed_hint"}}{{end}}</p>
{{range .Site.Feeds}}{{if eq .Type "application/rss+xml"}}<p class="hm-empty-state__actions"><a class="hm-btn hm-btn--secondary" href="{{.Href}}">{{t $ "subscribe_rss"}}</a></p>
{{end}}{{end}}</div>{{end}}
