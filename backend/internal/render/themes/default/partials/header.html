{{define "header"}}<header class="hm-header">
<div class="hm-container hm-header__inner">
<a class="hm-logo" href="/">{{if .Site.LogoURL}}<img src="{{imgsrc .Site.LogoURL}}" alt="{{.Site.Name}}" height="28">{{else}}<span class="hm-logo__mark" aria-hidden="true">旗本</span><span class="hm-logo__name">{{.Site.Name}}</span>{{end}}</a>
{{template "nav" dict "Items" .Site.Nav "Path" .Path}}
<button type="button" class="hm-theme-toggle" data-hm-theme-toggle aria-label="Switch to dark mode" aria-pressed="false" hidden><svg class="hm-theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="hm-theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
{{with .Site.HeaderCTA}}<a class="hm-btn hm-header__cta" href="{{cta .URL}}">{{.Label}}</a>
{{end}}</div>
</header>{{end}}
