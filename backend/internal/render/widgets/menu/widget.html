{{define "items"}}{{range .}}<li><a href="{{.Href}}"{{if .Blank}} target="_blank" rel="noopener noreferrer"{{end}}{{if .Current}} aria-current="page"{{end}}>{{.Label}}</a>{{if .Children}}<ul class="hm-menu__s">{{template "items" .Children}}</ul>{{end}}</li>{{end}}{{end -}}
<nav {{.Attrs}} aria-label="{{.X.Label}}">{{if .X.Items}}<ul class="hm-menu__l">{{template "items" .X.Items}}</ul>{{else}}<p class="hm-ph">Menu "{{.X.Location}}" has no items</p>{{end}}</nav>
