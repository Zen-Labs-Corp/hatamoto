<div {{.Attrs}}>{{if .Canvas}}{{if .X.Href}}<div class="hm-pdf__ph">PDF: {{.X.Title}}{{if .X.Name}} ({{.X.Name}}){{end}}</div>{{else}}<div class="hm-pdf__ph">Choose a PDF from the media library</div>{{end}}{{else}}<div class="hm-pdf__row">{{if .X.Frame}}<span class="hm-pdf__pre" aria-hidden="true">Can't see it? </span>{{end}}<a class="hm-pdf__link" href="{{.X.Href}}"{{if .X.Frame}} download{{end}}>{{.X.Text}}</a></div>{{if .X.Frame}}<iframe class="hm-pdf__frame" src="{{.X.Src}}" title="{{.X.Title}}" height="{{.X.Height}}" loading="lazy"></iframe>{{end}}{{end}}</div>
