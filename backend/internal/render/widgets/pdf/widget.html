<div {{.Attrs}}>{{if .Canvas}}<div class="hm-pdf__ph">PDF: {{.X.Title}}{{if .X.Name}} ({{.X.Name}}){{end}}</div>{{else if .X.Src}}<a class="hm-pdf__link" href="{{.X.Src}}">{{.X.Text}}</a>{{if .X.Frame}}<iframe class="hm-pdf__frame" src="{{.X.Src}}" title="{{.X.Title}}" height="{{.X.Height}}" loading="lazy"></iframe>{{end}}{{end}}</div>
