{{define "hm/areanav"}}{{$cur := .Section}}{{$g := ""}}<nav class="hm-subnav" aria-label="{{.AreaLabel}}">
<h2 class="hm-subnav__title hm-visually-hidden">{{.AreaLabel}}</h2>
<ul class="hm-subnav__list" role="list">{{range .AreaNav}}{{if and .Group (ne .Group $g)}}{{$g = .Group}}<li class="hm-subnav__group" role="presentation">{{.Group}}</li>
{{end}}<li><a class="hm-subnav__link" href="{{.Href}}"{{if eq .ID $cur}} aria-current="page"{{end}}><span{{if .Badge}} class="hm-subnav__text"{{end}}>{{.Label}}</span>{{if .Badge}}<span class="hm-subnav__marker">{{.Badge}}</span>{{end}}</a></li>
{{end}}</ul>
</nav>{{end}}
