{{/* File picker with a drop target. Data: ID (required), Name (default "file"), Accept, MaxMB, Help, Compact. The chosen files are listed by js/content.js. */}}
{{define "hm/dropzone"}}<label class="hm-dropzone{{if .Compact}} hm-dropzone--compact{{end}}" for="{{required "hm/dropzone ID" .ID}}" data-hm-dropzone-area>{{icon "upload"}}<span>Drop files here, or <u>browse</u>.</span><span class="hm-field__help" id="{{.ID}}-help">{{.Help}}</span><input class="hm-visually-hidden" type="file" id="{{.ID}}" name="{{or .Name "file"}}" multiple required accept="{{.Accept}}" aria-describedby="{{.ID}}-help" data-hm-max-mb="{{.MaxMB}}"></label>
<ul class="hm-dropzone__files" data-hm-dropzone-files role="list" aria-live="polite"></ul>
<template data-hm-dropzone-tpl>{{template "hm/button" dict "Label" "Remove" "Variant" "ghost" "Size" "sm" "Type" "button" "Attrs" (attrmap "data-hm-remove" "")}}{{template "hm/button" dict "Label" "Try again" "Variant" "ghost" "Size" "sm" "Type" "button" "Attrs" (attrmap "data-hm-retry" "")}}</template>{{end}}
