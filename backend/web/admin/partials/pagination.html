{{define "hm/pagination"}}<nav class="hm-pagination" aria-label="Pagination">
<p class="hm-pagination__summary hm-muted">Showing {{.From}}–{{.To}} of {{.Total}}</p>
<ul class="hm-pagination__list">
<li>{{if .HasPrev}}<a class="hm-pagination__link" rel="prev" href="{{.Href (sub .Page 1)}}">Previous</a>{{else}}<span class="hm-pagination__link" aria-disabled="true">Previous</span>{{end}}</li>
{{range .Links}}{{if .N}}<li><a class="hm-pagination__link" href="{{$.Href .N}}"{{if .Current}} aria-current="page"{{end}}><span class="hm-visually-hidden">Page </span>{{.N}}</a></li>{{else}}<li><span class="hm-pagination__gap" aria-hidden="true">…</span></li>{{end}}
{{end}}<li>{{if .HasNext}}<a class="hm-pagination__link" rel="next" href="{{.Href (add .Page 1)}}">Next</a>{{else}}<span class="hm-pagination__link" aria-disabled="true">Next</span>{{end}}</li>
</ul></nav>{{end}}
