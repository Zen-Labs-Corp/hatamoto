<ul class="hm-subnav__list" role="list">{{range .PluginsNav}}<li><a class="hm-subnav__link{{if .Muted}} hm-subnav__link--muted{{end}}" href="{{.Href}}"{{if .Current}} aria-current="page"{{end}}><span class="hm-subnav__text">{{.Label}}</span>{{if .Marker}}<span class="hm-subnav__marker">{{.Marker}}</span>{{end}}</a></li>
{{end}}</ul>
</nav>{{end}}
