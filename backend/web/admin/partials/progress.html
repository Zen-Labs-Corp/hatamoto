{{define "hm/progress"}}<div class="hm-meter" role="progressbar" aria-valuenow="{{.Width}}" aria-valuemin="0" aria-valuemax="100" aria-valuetext="{{.Value}}" aria-label="{{.Label}}"><p class="hm-meter__head"><span>{{required "hm/progress Label" .Label}}</span><span class="hm-meter__value">{{.Value}}</span></p><svg class="hm-meter__bar" aria-hidden="true" focusable="false"><rect class="hm-meter__track" width="100%" height="100%" rx="4"/><rect class="hm-meter__fill hm-viz--{{or .Kind "info"}}" width="{{.Width}}%" height="100%" rx="4"/></svg></div>{{end}}
