{{/* hm/taginput: ID (input id), Key (data-hm-fs binding), Label (accessible name), Placeholder, Hint. Behaviour: js/ui/taginput.js (adds the error id to aria-describedby with aria-invalid while invalid); chips come from the template. */}}
{{define "hm/taginput"}}<div class="hm-tokens" data-hm-ti data-hm-fs="{{.Key}}"><div class="hm-tokens__box"><ul class="hm-tokens__chips" role="list" data-hm-ti-chips></ul><input class="hm-tokens__input" type="text" id="{{.ID}}" autocomplete="off" inputmode="email" aria-label="{{.Label}}" aria-describedby="{{.ID}}-hint" placeholder="{{.Placeholder}}" data-hm-ti-input></div><p class="hm-field__help" id="{{.ID}}-hint">{{.Hint}}</p><p class="hm-field__error" id="{{.ID}}-err" data-hm-ti-err hidden></p><p class="hm-visually-hidden" role="status" aria-live="polite" data-hm-ti-live></p><template data-hm-ti-chip><li class="hm-chip"><span data-hm-ti-text></span><button type="button" class="hm-chip__x" aria-label="Remove" data-hm-ti-remove>{{icon "x"}}</button></li></template></div>{{end}}
