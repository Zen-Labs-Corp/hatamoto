{{define "hm/tracker"}}<ol class="hm-tracker{{if .States}} hm-tracker--states{{end}}{{if and .States (gt (len .Blocks) 45)}} hm-tracker--dense{{end}}" aria-label="{{required "hm/tracker Label" .Label}}">{{range .Blocks}}{{$tip := required "hm/tracker block Tip" .Tip}}<li class="hm-tracker__item"><span class="hm-tracker__block hm-viz--{{or .Kind "neutral"}}" role="img" aria-label="{{$tip}}" data-tooltip="{{$tip}}"></span></li>{{end}}</ol>{{if or .Start .End}}<p class="hm-tracker__range" aria-hidden="true"><span>{{.Start}}</span><span>{{.End}}</span></p>{{end}}{{if .Legend}}<ul class="hm-catbar__legend hm-tracker__legend{{if .States}} hm-tracker--states{{end}}">{{range .Legend}}<li><span class="hm-catbar__swatch hm-viz--{{or .Kind "neutral"}}" aria-hidden="true"></span>{{.Label}}</li>{{end}}</ul>{{end}}{{end}}
