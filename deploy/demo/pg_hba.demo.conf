# pg_hba.demo.conf - the demo cluster's whole pg_hba (it replaces the one initdb wrote).
# Nothing but the demo lives in this cluster, so these few lines are all it needs.
#
# The superuser works through the unix socket only, and the socket's directory is 0700, owned by
# the cluster's OS user: setup.sql and the runbook use it, nobody else can reach it.
local  all  postgres  trust
local  all  all       reject
# The demo service's own login reaches the demo database only, never the template that every
# reset restores. Plugin roles (hm_p_<id>_<name>, made by the app) reach the demo database too.
host  hatamoto_demo  hatamoto_demo  127.0.0.1/32  scram-sha-256
host  hatamoto_demo  "/^hm_p_[0-9a-f]{8}_"  127.0.0.1/32  scram-sha-256
# The reset role reads the template and the demo database, and creates/drops the demo database
# through the postgres database.
host  hatamoto_demo,hatamoto_demo_template  hatamoto_demo_reset  127.0.0.1/32  scram-sha-256
host  postgres  hatamoto_demo_reset  127.0.0.1/32  scram-sha-256
host  all  all  127.0.0.1/32  reject
host  all  all  ::1/128  reject
