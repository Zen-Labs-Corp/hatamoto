# postgresql.demo.conf - the demo's OWN Postgres cluster (docs/deploy/public-demo.md, step 3).
# Included from the cluster's postgresql.conf: include 'postgresql.demo.conf'
# The port and the socket directory are repeated in hatamoto-demo-pg.service (command-line options win).

cluster_name = 'hatamoto-demo'        # reset.sh refuses a cluster that does not report this
port = 5442
listen_addresses = '127.0.0.1'
unix_socket_directories = '/run/hatamoto-demo-pg'
unix_socket_permissions = 0700        # only the cluster's OS user (and root) reach the socket
password_encryption = scram-sha-256
log_statement = 'none'                # setup.sql sets role passwords

# What bounds the cluster. Its data dir is on the size-capped filesystem, so these keep a
# well-behaved server inside it; the filesystem is the hard bound.
# temp_file_limit is PER PROCESS (each connection, and each parallel worker a query starts), not per
# cluster. Parallel query is off (max_parallel_workers_per_gather = 0), so the processes that can spill
# are the connections: the most all of them can spill is max_connections x temp_file_limit =
# 24 x 32MB = 768MB, and that is the number the filesystem must have room for beside the data (hence 2 GiB).
max_connections = 24                  # the app pool is 10; plugin roles and the reset need a few
superuser_reserved_connections = 3
temp_file_limit = 32MB
max_parallel_workers_per_gather = 0   # a parallel worker would have its own temp_file_limit: keep the bound at 768MB
statement_timeout = 30s
idle_in_transaction_session_timeout = 30s
max_wal_size = 256MB
min_wal_size = 32MB
shared_buffers = 64MB
work_mem = 4MB
maintenance_work_mem = 32MB
